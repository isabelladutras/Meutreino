<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Bem-Estar</title>
<meta name="theme-color" content="#16121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bem-Estar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Painel pessoal escuro, rosa→roxo como acento; azul para cardio, âmbar para alertas, verde para feito */
  :root{
    color-scheme:dark;
    --bg:#16121a; --card:#221c27; --card2:#2b2431; --line:#3a3140;
    --txt:#f4eef6; --mut:#a99fb0; --acc:#ff3d8b; --acc2:#b44dff;
    --ok:#3ddc97; --warn:#ffb547; --bad:#ff6b6b; --cyan:#4cc9f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(120px + env(safe-area-inset-bottom))}
  button{font:inherit}
  .wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  header{padding:18px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:24px;letter-spacing:-.02em}
  h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hdate{color:var(--mut);font-size:14px}
  .top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);box-shadow:0 -120px 0 120px var(--bg);clip-path:inset(-120px 0 0 0);padding:10px 0 8px}
  .mainnav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
  .mainnav button{position:relative;border:0;background:transparent;color:var(--mut);padding:9px 0;border-radius:10px;font-weight:600;font-size:13px;min-width:0}
  .mainnav button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
  .mainnav .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .tabs{display:flex;gap:8px;padding-top:10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--txt);
    border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;margin-top:6px}
  .tab.on{background:var(--card2);border-color:var(--acc)}
  .tab .nx{position:absolute;top:-8px;right:-2px;background:var(--ok);color:#0d2a1d;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
  details.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:2px 0 12px;font-size:14px;color:var(--mut)}
  details.how summary{color:var(--txt);font-weight:600;cursor:pointer;list-style:none}
  details.how summary::-webkit-details-marker{display:none}
  details.how ul{margin:8px 0 4px;padding-left:18px} details.how li{margin:5px 0}
  details.how.safe{border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.07)}
  .dayhead{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:4px 0 14px}
  .dayhead .k{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .dayhead h2{margin:4px 0 8px;font-size:21px;text-wrap:balance}
  .meta{display:flex;gap:14px;color:var(--mut);font-size:14px;flex-wrap:wrap}
  .meta b{color:var(--txt)}
  .bar{height:6px;background:var(--card2);border-radius:9px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .ex.done{border-color:rgba(61,220,151,.5)}
  .ex.cardio{background:linear-gradient(160deg,#1f2230,#221c27)}
  .exh{display:flex;gap:12px;align-items:flex-start}
  .num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
  .ex.cardio .num{background:linear-gradient(135deg,#2fa9d6,#5b6cff)}
  .ex.done .num{background:var(--ok);color:#0d2a1d}
  .exh h3{margin:2px 0 0;font-size:17px;line-height:1.25}
  .mus{color:var(--mut);font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin:0 6px 4px 0}
  .b-ca{background:rgba(76,201,240,.15);color:var(--cyan)}
  .b-lv{background:rgba(255,181,71,.15);color:var(--warn)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .chip{background:var(--card2);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--mut)}
  .chip b{color:var(--txt)}
  .tec{background:rgba(255,61,139,.09);border-left:3px solid var(--acc);border-radius:8px;padding:9px 11px;font-size:14px;margin:10px 0}
  .tec b{color:var(--acc)}
  .txt{font-size:14px;color:var(--mut);margin:8px 0}
  details.obs{margin:10px 0 6px;background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px}
  details.obs.alert{background:rgba(255,181,71,.10);border:1px solid rgba(255,181,71,.35)}
  details.obs summary{cursor:pointer;font-weight:600;list-style:none}
  details.obs summary::-webkit-details-marker{display:none}
  details.obs summary::after{content:" ▾";color:var(--mut)}
  details.obs[open] summary::after{content:" ▴"}
  details.obs ul{margin:8px 0 2px;padding-left:18px}
  details.obs li{margin:5px 0}
  .vid{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;padding:8px 12px;border-radius:10px;background:rgba(255,61,139,.12);color:#ff8fbd;font-size:14px;font-weight:600;text-decoration:none}
  .sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .set{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:8px 10px;min-height:48px}
  .set .i{width:22px;color:var(--mut);font-size:13px;text-align:center}
  .set .r{flex:1;font-weight:600;min-width:0}
  .chk{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:transparent;color:transparent;font-size:20px;display:grid;place-items:center;flex:0 0 36px}
  .chk.on{background:var(--ok);border-color:var(--ok);color:#0d2a1d}
  .set.on .r{color:var(--mut);text-decoration:line-through}
  .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .ex.cardio .go{background:linear-gradient(90deg,#2fa9d6,#5b6cff)}
  .load{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .load label{font-size:13px;color:var(--mut)}
  .stp{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:18px}
  .load input,.num-in{width:70px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);text-align:center;font-size:16px;font-weight:700}
  .load .last{font-size:12px;color:var(--mut);width:100%}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));margin:8px 0}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600}
  .hist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
  .hist h4{margin:0 0 8px;font-size:15px}
  .hist .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
  .hist .row span:nth-child(2){color:var(--mut);text-align:right;margin-left:auto}
  .del{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:4px 9px;font-size:13px}
  /* Hoje */
  .dnav{display:flex;align-items:center;gap:10px}
  .dnav h2{margin:0;flex:1;text-align:center;font-size:20px}
  .dnav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:22px}
  .dnav button:disabled{opacity:.3}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
  .sec > h3{margin:0 0 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline}
  .sec > h3 b{color:var(--txt);letter-spacing:0;text-transform:none;font-size:13px}
  .med{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .sec > h3 + .med{border-top:0}
  .med .tx{flex:1;min-width:0}
  .med .tx b{display:block;font-size:15px}
  .med .tx span{display:block;font-size:12.5px;color:var(--mut);line-height:1.3}
  .med .tx em{font-style:normal;color:var(--warn)}
  .med.on .tx b{color:var(--mut);text-decoration:line-through}
  .note{font-size:13px;color:var(--mut);background:var(--card2);border-radius:10px;padding:9px 11px;margin-top:8px}
  .note.warn{background:rgba(255,181,71,.10);color:#ffd9a0}
  .mini{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:8px 11px;font-weight:600;font-size:13px}
  .mini.acc{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
  .meals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .meal2{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px;min-width:0}
  .meal2 b{display:block;font-size:15px;margin-bottom:8px}
  .meal2.on{border-color:var(--ok);background:rgba(61,220,151,.10)}
  .meal2.no{border-color:rgba(255,181,71,.6);background:rgba(255,181,71,.08)}
  .meal2 .mb{display:flex;gap:4px}
  .meal2 .mb button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:9px;padding:8px 2px;font-size:13px;font-weight:600}
  .meal2.on .mb button.sel{background:var(--ok);border-color:var(--ok);color:#0d2a1d}
  .meal2.no .mb button.sel{background:var(--warn);border-color:var(--warn);color:#2a1d05}
  .cafebt{display:flex;gap:6px;align-items:center}
  .mini.skipsel{background:var(--warn);border-color:var(--warn);color:#2a1d05}
  .chk.skip{background:var(--warn);border-color:var(--warn);color:#2a1d05}
  .meal{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px;color:var(--txt);font-weight:600;font-size:15px;text-align:left}
  .meal.on{border-color:var(--ok);background:rgba(61,220,151,.10)}
  .meal i{font-style:normal;color:var(--ok);font-size:18px;visibility:hidden}
  .meal.on i{visibility:visible}
  .cnts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .cnt{background:var(--card2);border-radius:12px;padding:10px}
  .cnt .l{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px}
  .cnt .c{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .cnt .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .cnt .v small{font-size:12px;color:var(--mut);font-weight:600}
  .dq{padding:12px 0;border-top:1px solid var(--line)}
  .sec > h3 + .dq{border-top:0}
  .dl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .dv{font-size:22px;font-weight:800;color:var(--acc)}
  .dq input[type=range]{width:100%;accent-color:var(--acc);height:28px}
  .dq input[type=range].vazio{opacity:.45}
  .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
  .dq textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:10px;font:inherit;font-size:15px}
  .seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px;border-radius:8px;font-weight:600;font-size:14px}
  .seg button.on{background:var(--line);color:var(--txt)}
  .med.tl .hr{flex:0 0 44px;font-weight:800;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
  .med.tl.next{background:rgba(255,61,139,.10);border-radius:12px;padding-left:8px;padding-right:8px;border-top-color:transparent}
  .med.tl.next .hr{color:var(--acc)}
  .med.tl.late{background:rgba(255,181,71,.10);border-radius:12px;padding-left:8px;padding-right:8px;border-top-color:transparent}
  .med.tl.late .hr{color:var(--warn)}
  .med.tl.opc .tx b{font-weight:600;color:var(--mut)}
  .crisebtn{background:linear-gradient(90deg,#d6336c,#7b3dff);margin:0 0 12px}
  .crisebox{border-color:rgba(255,61,139,.5)}
  .seg.col{flex-direction:column;gap:4px} .seg.col button{text-align:left;padding:10px 12px}
  details.refd summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
  details.refd summary::-webkit-details-marker{display:none}
  details.refd summary .hr{font-weight:800;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
  details.refd summary b{flex:1;font-size:17px}
  details.refd summary::after{content:"▾";color:var(--mut)} details.refd[open] summary::after{content:"▴"}
  .pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .pill.ok{background:rgba(61,220,151,.15);color:var(--ok)} .pill.no{background:rgba(255,181,71,.15);color:var(--warn)}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .opts button{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600}
  .opts button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
  .grp{padding:9px 0;border-top:1px solid var(--line)}
  .gn{font-weight:700;font-size:14px;margin-bottom:6px} .gn span{color:var(--mut);font-weight:400}
  .chs{display:flex;flex-direction:column;gap:5px}
  .chs button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:14px}
  .chs button.on{border-color:var(--ok);background:rgba(61,220,151,.12)}
  .chs button.on::before{content:"✓ ";color:var(--ok);font-weight:800}
  .fx{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:14px}
  .fx i{font-style:normal;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 22px;font-size:13px}
  .fx.on{border-color:var(--ok);background:rgba(61,220,151,.12)} .fx.on i{background:var(--ok);border-color:var(--ok);color:#0d2a1d}
  .fx em{font-style:normal;color:var(--mut);font-size:12.5px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0 4px}
  .mgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
  .mgrid input{width:100%}

  /* ===== layout novo ===== */
  .dayhead.slim{padding:10px 12px;margin-bottom:10px}
  .dayhead.slim .dnav h2{font-size:18px}
  .dayhead.slim .dnav button{width:36px;height:36px}
  .subnav{flex:1 1 100%;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:8px}
  .subnav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:9px;padding:8px 4px;font-weight:600;font-size:13.5px}
  .subnav button.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--acc)}
  .avisos{border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.06)}
  .avisos h3{color:var(--warn)}
  .av{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,181,71,.18);font-size:13.5px;color:#ffe1b3}
  .avisos h3 + .av{border-top:0}
  .av span{flex:1 1 220px;min-width:0}
  .av .x{flex:0 0 30px;height:30px;border-radius:8px;border:1px solid rgba(255,181,71,.35);background:transparent;color:var(--warn)}
  .agora{border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(150deg,rgba(255,61,139,.22),rgba(180,77,255,.18));border:1px solid rgba(255,61,139,.45)}
  .agora.late{background:linear-gradient(150deg,rgba(255,181,71,.22),rgba(255,107,107,.12));border-color:rgba(255,181,71,.55)}
  .agora.done{background:rgba(61,220,151,.10);border-color:rgba(61,220,151,.45)}
  .agora .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#ffb3d1}
  .agora.late .k{color:var(--warn)} .agora.done .k{color:var(--ok)}
  .agora h2{margin:4px 0 4px;font-size:21px;line-height:1.2;text-wrap:balance}
  .agora .mus{color:#d9cde2}
  .acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .big{flex:1 1 auto;min-width:96px;border:0;border-radius:12px;padding:13px 12px;font-weight:700;font-size:15px;color:var(--txt);background:var(--card2)}
  .big.ok{background:var(--ok);color:#0d2a1d}
  .big.warn{background:var(--warn);color:#2a1d05}
  .big.ghost2{background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .depois{margin-top:10px;font-size:13px;color:#cfc3d8}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--txt);min-width:0}
  .tile.wide{grid-column:1/-1}
  .tile.done{border-color:rgba(61,220,151,.5)}
  .tile .l{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .tile .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .tile .v small{font-size:13px;color:var(--mut);font-weight:600}
  .tile .pb{align-self:stretch;height:5px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:4px}
  .tile .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .tile .pb.blue i{background:linear-gradient(90deg,#2fa9d6,#5b6cff)}
  .tile .aq{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rxs{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--mut)}
  .sec > h3 + .rxs{border-top:0}
  .rxs b{color:var(--txt)}
  /* dieta */
  .ref{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
  .ref.ok{border-color:rgba(61,220,151,.45)} .ref.no{border-color:rgba(255,181,71,.45)}
  .ref.open{padding-bottom:14px}
  .refh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--txt);padding:14px 16px;text-align:left}
  .refh .hr{font-weight:800;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 42px}
  .refh .t{flex:1;min-width:0}
  .refh .t b{display:block;font-size:17px}
  .refh .t small{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .refh i{font-style:normal;color:var(--mut)}

<body>
<div class="wrap">
  <header><h1 id="titulo"></h1><span class="hdate" id="hdate"></span></header>
  <div class="top"><nav class="mainnav" id="mainnav"></nav><nav class="tabs" id="tabs"></nav></div>
  <main id="main"></main>
</div>

<div class="tm" id="tm">
  <div class="in">
    <div class="t" id="tmT">0:00</div>
    <div class="l"><b id="tmL">Descanso</b><span id="tmN"></span></div>
    <div class="bt">
      <button id="tmA">+15s</button>
      <button id="tmP" hidden>❚❚</button>
      <button id="tmS">Pular</button>
      <button id="tmX" hidden>✕</button>
    </div>
  </div>
  <div class="pg"><i id="tmG"></i></div>
</div>
<div class="clock" id="clock">⏱ 0:00</div>

<script src="treino.js"></script>
<script>
(() => {
  // ================= utilidades =================
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} },
    del(k){ try{ localStorage.removeItem(k) }catch(e){} }
  };
  const P = PROTOCOLO, S = (typeof SAUDE !== "undefined") ? SAUDE : { faltaArquivo: true };
  // valores padrão, caso o treino.js seja de uma versão anterior
  S.rotina = S.rotina || { acordar: "07:00", dormir: "22:45", cafe: "07:30" };
  S.estoque = S.estoque || { data: "2026-11-01", qtd: {}, nomeCaixa: {}, unidade: {} };
  S.estoque.qtd = S.estoque.qtd || {};
  S.avisoPrednisolona = S.avisoPrednisolona || "";
  S.validadeReceitas = S.validadeReceitas || "2026-11-30";
  ["diarios","cursos","semanais","noiteSeDor","sos","refeicoes","lembretesEndocrino"].forEach(k => S[k] = S[k] || []);
  const GUIA = (typeof COMO_FAZER !== "undefined") ? COMO_FAZER : {};
  const DT = (typeof DIETA !== "undefined") ? DIETA : null;
  const $ = s => document.querySelector(s);
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const curto = n => n.split(" ")[0];
  const dur = s => s >= 60 ? (s % 60 ? fmt(s) : (s/60) + " min") : s + "s";
  const isoDe = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const hojeISO = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return isoDe(d) };
  const dataDe = iso => new Date(iso + "T12:00:00");
  const diasEntre = (a, b) => Math.round((dataDe(b) - dataDe(a)) / 864e5);
  const brData = iso => iso.split("-").reverse().slice(0,2).join("/");
  const SEM = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") };
  const quando = ts => { const iso = isoDe(new Date(ts)); return (iso === hojeISO() ? "hoje" : iso === hojeISO(1) ? "amanhã" : iso === hojeISO(-1) ? "ontem" : brData(iso)) + " às " + hhmm(ts) };

  function toast(msg){
    let t = document.getElementById("toast");
    if (!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t) }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function duploToque(btn, msg, fn){
    if (btn.dataset.armado){ delete btn.dataset.armado; btn.textContent = btn.dataset.txt; fn(); return }
    btn.dataset.txt = btn.textContent; btn.dataset.armado = "1"; btn.textContent = msg;
    setTimeout(() => { if (btn.dataset.armado){ delete btn.dataset.armado; btn.textContent = btn.dataset.txt } }, 3000);
  }

  $("#titulo").innerHTML = esc(P.titulo).replace(/(\S+)$/, "<span>$1</span>");
  $("#hdate").textContent = SEM[new Date().getDay()] + ", " + brData(hojeISO());

  // ================= estado =================
  let secao = store.get("secao", "hoje");
  if (!["hoje","dieta","treino","remedios","resumo"].includes(secao)) secao = "hoje";
  let dOff = 0;
  const cfg = () => store.get("cfg", {});
  const setCfg = (k, v) => { const c = cfg(); if (v == null) delete c[k]; else c[k] = v; store.set("cfg", c) };
  const getDiario = () => store.get("diario", {});
  const entrada = iso => getDiario()[iso] || {};
  function salvarDia(iso, campo, valor){
    const all = getDiario(); all[iso] = { ...(all[iso] || {}), [campo]: valor }; store.set("diario", all);
    const sv = document.getElementById("salvo"); if (sv){ sv.textContent = "✓ salvo"; sv.style.opacity = .4; setTimeout(() => sv.style.opacity = 1, 150) }
  }
  function salvarSub(iso, grupo, id, valor){
    const all = getDiario(); const e = all[iso] || {}; e[grupo] = { ...(e[grupo] || {}), [id]: valor }; all[iso] = e; store.set("diario", all);
    const sv = document.getElementById("salvo"); if (sv) sv.textContent = "✓ salvo";
  }
  const getSOS = () => store.get("sos", []);

  // ================= navegação =================
  function renderNav(){
    const pend = pendentesHoje();
    const items = [["hoje","Hoje"],["remedios","Remédios"],["dieta","Dieta"],["treino","Treino"],["resumo","Resumo"]];
    $("#mainnav").innerHTML = items.map(([k,l]) => `<button data-sec="${k}" class="${secao===k?"on":""}">${l}${k==="remedios" && pend && secao!=="remedios" ? '<i class="dot"></i>' : ""}</button>`).join("");
    const t = $("#tabs");
    if (secao === "treino"){
      const nx = proximo();
      t.innerHTML = P.dias.map(d => `<button class="tab ${d.id===dia?"on":""}" data-d="${d.id}">${d.principal ? "💙 " : d.id + " · "}${esc(d.nome)}${d.id===nx?'<span class="nx">PRÓXIMO</span>':""}</button>`).join("");
      t.hidden = false;
    } else if (secao === "remedios"){
      t.innerHTML = `<div class="subnav">${[["hoje","Do dia"],["sos","Crise"],["gerenciar","Gerenciar"]].map(([k,l]) => `<button data-rsub="${k}" class="${rsub===k?"on":""}">${l}</button>`).join("")}</div>`;
      t.hidden = false;
    } else { t.innerHTML = ""; t.hidden = true }
  }
  let rsub = "hoje";
  $("#mainnav").addEventListener("click", e => {
    const b = e.target.closest("[data-sec]"); if (!b) return;
    secao = b.dataset.sec; store.set("secao", secao); dOff = 0; if (secao === "remedios") rsub = "hoje"; render(); window.scrollTo({ top: 0 });
  });
  $("#tabs").addEventListener("click", e => {
    const r = e.target.closest("[data-rsub]"); if (r){ rsub = r.dataset.rsub; render(); window.scrollTo({ top: 0 }); return }
    const b = e.target.closest(".tab"); if (!b) return;
    dia = b.dataset.d; render(); window.scrollTo({ top: 0 });
  });
  function render(){ try{ renderInner() }catch(err){
    $("#main").innerHTML = `<section class="sec"><h3>Algo deu errado</h3><div class="mus">Seus dados continuam salvos. Se você atualizou pelo GitHub, confira se enviou o <b>index.html</b> e o <b>treino.js</b> da mesma versão.</div><div class="note">${esc(err && err.message)}</div></section>` } }
  function renderInner(){
    if (S.faltaArquivo && secao !== "treino"){ renderNav(); $("#main").innerHTML = `<section class="sec"><h3>Falta atualizar o treino.js</h3><div class="mus">Esta versão do app precisa do <b>treino.js</b> novo. Envie ele para o GitHub junto com o index.html.</div></section>`; return }
    renderNav();
    if (secao === "hoje") renderPainel();
    else if (secao === "dieta") renderDieta();
    else if (secao === "remedios") renderRemedios();
    else if (secao === "resumo") renderResumo();
    else renderTreino();
    tickClock();
  }

  // ================= agenda dos remédios =================
  function inicioDe(id){
    const c = cfg(), curso = S.cursos.find(x => x.id === id);
    if (curso && curso.inicioDe) return c[curso.inicioDe + "Inicio"] || null;
    return c[id + "Inicio"] || null;
  }
  function totalDias(curso){ return curso.etapas ? curso.etapas.reduce((a,e) => a + e.dias, 0) : curso.dias }
  function doseCurso(curso, iso){
    const ini = inicioDe(curso.id); if (!ini) return null;
    const n = diasEntre(ini, iso) + 1, tot = totalDias(curso);
    if (n < 1 || n > tot) return null;
    let dose = null;
    if (curso.etapas){ let acc = 0; for (const et of curso.etapas){ acc += et.dias; if (n <= acc){ dose = et.dose; break } } }
    return { n, tot, dose };
  }
  // lista do que tomar num dia: {id, periodo, nome, detalhe, extra}
  function agenda(iso){
    const out = [];
    S.cursos.filter(c => c.periodo === "manha").sort((a,b) => (a.ordem||0) - (b.ordem||0)).forEach(c => {
      const d = doseCurso(c, iso); if (d) out.push({ id: c.id, periodo: "manha", nome: c.nome + (d.dose ? " · " + d.dose : ""), detalhe: `${c.detalhe} · dia ${d.n} de ${d.tot}` });
    });
    const ativo = m => { const ini = cfg()[m.id + "Inicio"] || m.inicio; return !ini || iso >= ini };
    S.diarios.filter(m => m.periodo === "manha" && ativo(m)).forEach(m => out.push({ id: m.id, periodo: "manha", nome: m.nome, detalhe: m.detalhe }));
    S.semanais.forEach(m => {
      const ini = inicioDe(m.id); if (!ini) return;
      const n = diasEntre(ini, iso); if (n >= 0 && n % 7 === 0) out.push({ id: m.id, periodo: "semana", nome: m.nome, detalhe: `${m.detalhe} · ${n/7 + 1}ª semana` });
    });
    S.diarios.filter(m => m.periodo === "noite" && ativo(m)).forEach(m => out.push({ id: m.id, periodo: "noite", nome: m.nome, detalhe: m.detalhe }));
    S.cursos.filter(c => c.periodo === "noite").forEach(c => {
      const d = doseCurso(c, iso); if (d) out.push({ id: c.id, periodo: "noite", nome: c.nome, detalhe: `${c.detalhe} · dia ${d.n} de ${d.tot}` });
    });
    return out.map(m => ({ ...m, hora: horaDe(m.id) }));
  }
  const toMin = t => { const [a,b] = String(t || "12:00").split(":"); return (+a)*60 + (+b||0) };
  function horaDe(id){ for (const k of ["diarios","cursos","semanais","noiteSeDor"]){ const m = S[k].find(x => x.id === id); if (m) return m.hora || "12:00" } return "12:00" }
  function pendentesHoje(){
    const iso = hojeISO(), e = entrada(iso), now = new Date().getHours()*60 + new Date().getMinutes();
    return agenda(iso).filter(m => !(e.meds||{})[m.id] && toMin(m.hora) <= now).length + criseFollow().length;
  }
  // ================= ESTOQUE =================
  const todosMeds = () => [...S.diarios, ...S.cursos, ...S.semanais, ...S.noiteSeDor, ...S.sos];
  function estoqueBase(){ const c = cfg().estoque; return c || { data: S.estoque.data, qtd: { ...S.estoque.qtd } } }
  function unidadesDia(id, iso){
    const cu = S.cursos.find(x => x.id === id);
    if (cu && cu.etapas){ const d = doseCurso(cu, iso); if (!d) return 1; let acc = 0; for (const et of cu.etapas){ acc += et.dias; if (d.n <= acc) return et.comp ?? 1 } }
    return 1;
  }
  function restante(id){
    const b = estoqueBase(); const q = b.qtd[id]; if (q == null || q === "") return null;
    let usado = 0;
    Object.entries(getDiario()).forEach(([d, e]) => { if (d >= b.data && e.meds && e.meds[id]) usado += unidadesDia(id, d) });
    getSOS().forEach(x => { if (x.id === id && isoDe(new Date(x.ts)) >= b.data) usado += (x.qtd || 1) });
    return Math.round((q - usado) * 10) / 10;
  }
  // quanto restava antes de hoje (para recomeçar a contagem sem perder o consumo)
  function restanteAte(id, b){
    const q = b.qtd[id]; if (q == null || q === "") return q ?? null;
    let usado = 0, hoje = hojeISO();
    Object.entries(getDiario()).forEach(([d, e]) => { if (d >= b.data && d < hoje && e.meds && e.meds[id]) usado += unidadesDia(id, d) });
    getSOS().forEach(x => { const d = isoDe(new Date(x.ts)); if (x.id === id && d >= b.data && d < hoje) usado += (x.qtd || 1) });
    return Math.round((q - usado) * 10) / 10;
  }
  function previsao(id){
    const r = restante(id); if (r == null) return null;
    if (S.diarios.some(m => m.id === id)) return { r, dias: Math.floor(r), tipo: "diario" };
    const cu = S.cursos.find(x => x.id === id);
    if (cu){ const ini = inicioDe(cu.id), tot = totalDias(cu); let falta = 0;
      for (let k = 0; k < tot; k++){ const d = ini ? isoDe(new Date(dataDe(ini).getTime() + k*864e5)) : null; if (!ini || (d >= hojeISO() && !(d === hojeISO() && getDiario()[d]?.meds?.[id]))) falta += ini ? unidadesDia(id, d) : (cu.etapas ? cu.etapas.reduce((a,et) => a + et.comp*et.dias, 0)/tot : 1) }
      return { r, falta: Math.round(falta*10)/10, tipo: "curso" } }
    if (S.semanais.some(m => m.id === id)) return { r, semanas: Math.floor(r), tipo: "semanal" };
    return { r, tipo: "sos" };
  }
  function alertasEstoque(){
    const out = [];
    todosMeds().forEach(m => { const p = previsao(m.id); if (!p) return;
      if (p.tipo === "diario" && p.dias <= 7) out.push(`${m.nome}: ${p.r <= 0 ? "acabou" : "dá para " + p.dias + " dia" + (p.dias===1?"":"s")}`);
      if (p.tipo === "curso" && p.r < p.falta) out.push(`${m.nome}: tem ${fmtN(p.r)}, faltam ${fmtN(p.falta)} para terminar o tratamento`);
      if (p.tipo === "sos" && p.r <= 3) out.push(`${m.nome}: ${p.r <= 0 ? "acabou" : "restam " + fmtN(p.r)}`);
      if (p.tipo === "semanal" && p.semanas <= 1) out.push(`${m.nome}: ${p.r <= 0 ? "acabou" : "resta " + p.r + " aplicação"}`);
    });

  }
  function diasCiclo(){ return Object.entries(getDiario()).filter(([,e]) => e.meds && e.meds.ciclobenzaprina).map(([d]) => d).sort() }

  // ================= regras dos remédios de crise =================
  function statusSOS(m, now = Date.now()){
    const log = getSOS(), dia = 24 * 36e5;
    const meus = log.filter(x => x.id === m.id && now - x.ts < dia && x.ts <= now);
    const qtd = meus.reduce((a,x) => a + (x.qtd || 1), 0);
    if (m.grupo){
      const outro = log.filter(x => x.id !== m.id && S.sos.find(s => s.id === x.id)?.grupo === m.grupo && now - x.ts < dia && x.ts <= now).sort((a,b) => b.ts - a.ts)[0];
      if (outro){ const n = S.sos.find(s => s.id === outro.id).nome.split(" ")[0];
        return { cls: "no", ok: false, txt: `Não tome: você tomou ${n} ${quando(outro.ts)}. Liberado ${quando(outro.ts + dia)}.` } }
    }
    if (qtd >= m.max24h){ const prim = meus.sort((a,b) => a.ts - b.ts)[0];
      return { cls: "no", ok: false, txt: `Limite de 24 h atingido (${qtd}/${m.max24h}). Liberado ${quando(prim.ts + dia)}.` } }
    if (meus.length && m.repetirHoras){ const ult = meus.sort((a,b) => b.ts - a.ts)[0], lib = ult.ts + m.repetirHoras * 36e5;
      if (now < lib) return { cls: "wait", ok: false, txt: `Tomou ${quando(ult.ts)}. Pode repetir a partir de ${hhmm(lib)} (${qtd}/${m.max24h} em 24 h).` } }
    if (meus.length) return { cls: "ok", ok: true, txt: `Pode tomar mais, se precisar (${qtd}/${m.max24h} em 24 h).` };
    return { cls: "", ok: true, txt: `Nenhuma dose nas últimas 24 h · máximo ${m.max24h} em 24 h.` };
  }

  // ================= HOJE =================
  const escala = (campo, label, val, ajuda) => `<div class="dq"><div class="dl"><b>${label}</b><span class="dv" id="v-${campo}">${val ?? "–"}</span></div>

  function treinouEm(iso, ids){

  }

  function renderHoje(){ render() }
  const dnavHTML = iso => `<div class="dnav"><button data-dnav="-1" aria-label="dia anterior">‹</button><h2>${dOff===0?"Hoje":dOff===-1?"Ontem":SEM[dataDe(iso).getDay()]} · ${brData(iso)}</h2><button data-dnav="1" ${dOff>=0?"disabled":""} aria-label="próximo dia">›</button></div>`;

  // passos do dia: remédios + café (+ outras refeições, no painel)
  function passosDia(iso, comRefeicoes){
    const e = entrada(iso), ag = agenda(iso), cic = S.noiteSeDor[0], usouCic = !!(e.meds||{})[cic.id], dc = diasCiclo();

        detalhe: v === "nao" ? "você marcou que não comeu" : r.id === "cafe" && ag.some(m => m.id === "pantoprazol") ? "pelo menos 30 min depois do pantoprazol" : r.id === "cafe" ? "depois dele, o que é do café" : "escolha no cardápio" }) });

  function avisosHoje(){

  const avisosHTML = () => { const av = avisosHoje(); return av.length ? `<section class="sec avisos"><h3>Atenção</h3>${av.map(a => `<div class="av"><span>${esc(a.txt)}</span>${a.acao || ""}<button class="x" data-avok="${esc(a.k)}" aria-label="dispensar por hoje">✕</button></div>`).join("")}</section>` : "" };

        h += `<section class="agora ${late ? "late" : ""}"><div class="k">${late ? "Atrasado" : toMin(prox.hora) <= now + 30 ? "Agora" : "Próximo"} · ${prox.hora}</div><h2>${esc(prox.nome)}</h2><div class="mus">${esc(prox.detalhe)}</div>
          <div class="acts2">${acts}</div>${depois ? `<div class="depois">Depois: <b>${esc(depois.nome.split(" · ")[0])}</b> às ${depois.hora}</div>` : ""}</section>`;

      ${tile("treino", "Movimento", cardio || musc ? [cardio ? "Cardio" : "", musc ? "Musc." : ""].filter(Boolean).join(" + ") : "<small>ainda não</small>", cardio || musc ? 100 : 0)}

      ${opcoes("crise", "Teve crise de enxaqueca?", e.crise, ["Não","Sim"])}

        <button class="stp" data-sono="-0.5">−</button><input id="sono" class="num-in" inputmode="decimal" value="${e.sono ?? ""}" placeholder="7" aria-label="horas de sono"><button class="stp" data-sono="0.5">+</button><label>horas</label></div></div>
      <div class="cnts" style="grid-template-columns:1fr">${contador("cafeina","Café / cafeína",e.cafeina,1,"xíc.")}</div>
      ${opcoes("cardio", "Fez cardio leve?", e.cardio ?? (treinouEm(iso, ["C"]).length ? "Sim" : undefined), ["Sim","Não"])}
      <div class="dq"><div class="dl"><b>Minutos de cardio</b></div><div class="load" style="margin:0">
        <button class="stp" data-min="-5">−</button><input id="cardioMin" class="num-in" inputmode="numeric" value="${e.cardioMin ?? ""}" aria-label="minutos de cardio"><button class="stp" data-min="5">+</button><label>min</label></div></div>
      ${opcoes("treino", "Fez musculação?", e.treino ?? (treinouEm(iso, ["A","S","B"]).length ? "Sim" : undefined), ["Sim","Não"])}
      <div class="dq"><div class="dl"><b>Pressão</b><span class="mus">opcional</span></div>
        <div class="load" style="margin:0"><input id="pas" class="num-in" inputmode="numeric" placeholder="12" value="${esc(e.pas ?? "")}" aria-label="pressão máxima"><label>por</label><input id="pad" class="num-in" inputmode="numeric" placeholder="8" value="${esc(e.pad ?? "")}" aria-label="pressão mínima"></div></div>
      ` : ""}
      <div class="dq"><div class="dl"><b>Observação</b></div><textarea id="obs" rows="2" placeholder="Ex.: dor começou às 15h depois de muita tela, dormi mal…">${esc(e.obs ?? "")}</textarea></div>
    </section>`;

  }

  // ---- Remédios · do dia ----
  function timelineHTML(iso){
    const e = entrada(iso), c = cfg(), ps = passosDia(iso, false), ag = agenda(iso);
    const obrig = ps.filter(p => p.tipo !== "opc"), now = agoraMin(), prox = dOff === 0 ? obrig.find(p => !p.feito) : null;

      const late = dOff === 0 && !p.feito && p.tipo !== "opc" && toMin(p.hora) + 30 < now;

  function sosViewHTML(iso){

    </section>`;
  }

  // ================= ESTOU COM CRISE =================
  let crise = null; // {passo, intens, tipo}
  const getCrises = () => store.get("crises", []);
  function criseFollow(){ const now = Date.now(); return getCrises().map((c,k) => ({ ...c, k })).filter(c => !c.resposta && now - c.ts >= 2*36e5 && now - c.ts < 24*36e5) }
  function criseHTML(){
    let h = "";
    criseFollow().forEach(c => {
      const m = S.sos.find(x => x.id === c.remedio);
      h += `<section class="sec crisebox"><h3>Como está a crise das ${hhmm(c.ts)}?</h3>

        <div class="dq"><div class="dl"><b>Quão forte está a dor?</b><span class="dv" id="v-cint">${crise.intens ?? "–"}</span></div>
          <input type="range" min="1" max="10" step="1" value="${crise.intens ?? 5}" id="cint" class="${crise.intens==null?"vazio":""}" aria-label="intensidade da dor">

          ${[["rapida","Rápida e intensa"],["lenta","Devagar, dura horas ou voltou"],["nsei","Não sei"]].map(([k,l]) => `<button data-ctipo="${k}" class="${crise.tipo===k?"on":""}">${l}</button>`).join("")}</div></div>
        <button class="btn" data-cnext="1" ${crise.intens==null || !crise.tipo ? "disabled style=\"opacity:.4\"" : ""}>Ver o que tomar</button></section>`;
    }

        else { const outro = pref === z ? n : z; msg = `A neuro indicaria <b>${esc(pref.nome)}</b>, mas agora não pode: ${esc(st.txt)} Veja abaixo o que está liberado.`; lista = [outro, np, pref].filter(tenho) }

      } else { msg = `Escolha um triptano só: <b>Zolmitriptana</b> se a crise veio rápida e forte, <b>Naratriptana</b> se veio devagar ou costuma durar e voltar.`; lista = [z, n, np] }

      <div class="mus">Beba água. Daqui a 2 h o app pergunta se melhorou.</div></section>`;
  }
  function registrarCrise(remedio){
    const c = getCrises(); c.push({ ts: Date.now(), intens: crise.intens, tipo: crise.tipo, remedio: remedio || null }); store.set("crises", c.slice(-300));
    const iso = hojeISO(), e = entrada(iso);

    const d = P.dias.find(x => x.id === dia), chk = getChk();
    let h = `<details class="how" ${d.principal ? "open" : ""}><summary>ⓘ Orientação da neuro para esta fase</summary><ul>${P.notas.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>`;
    h += `<section class="dayhead"><div class="k">${d.principal ? "Principal nesta fase" : "Musculação leve · treino " + d.id}</div><h2>${esc(d.nome)}</h2>
      <div class="meta"><span><b>${esc(d.tempo)}</b></span>${d.leve ? '<span class="badge b-lv" style="margin:0">só se a neuro liberar</span>' : '<span><b>3 a 5×</b> por semana</span>'}</div>
      <div class="bar"><i id="prog"></i></div></section>`;
    h += `<details class="how safe"><summary>⚠️ Antes e durante o treino</summary><ul>${P.seguranca.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>`;
    let n = 0;
    d.exercicios.forEach((ex, i) => {
      n++;
      if (ex.intervalo){
        const id = `${i}-0-0`, rep = ex.repetir || 1, tot = Math.round(ex.fases.reduce((a,f)=>a+f.seg,0) * rep / 60);
        const resumo = rep > 1 ? `${rep}× ${dur(ex.fases[0].seg)}` : ex.fases.map(f => dur(f.seg)).join(" + ");
        h += `<article class="ex cardio" data-ex="${i}"><div class="exh"><div class="num">${n}</div><div style="flex:1">
          <span class="badge b-ca">${esc(ex.tipo)} · ${tot} min</span><h3>${esc(ex.nome)}</h3><div class="mus">${resumo}</div></div>
          <button class="chk ${chk[id]?"on":""}" data-id="${id}" aria-label="${esc(ex.nome)}">✓</button></div>
          ${ex.texto ? `<div class="txt">${esc(ex.texto)}</div>` : ""}<button class="go" data-run="${i}">▶ Iniciar</button></article>`;
        return;
      }
      h += `<article class="ex" data-ex="${i}"><div class="exh"><div class="num">${n}</div><div><h3>${esc(ex.nome)}</h3><div class="mus">${esc(ex.musculo||"")}</div></div></div>
        <div class="chips"><span class="chip">Séries <b>${ex.series.length}</b></span><span class="chip">Descanso <b>${ex.descanso}s</b></span><span class="chip">Sem chegar à falha</span></div>
        ${obsBlock(ex)}
        <div class="sets">${ex.series.map((r,s) => { const id = `${i}-0-${s}`;
          return `<div class="set ${chk[id]?"on":""}"><span class="i">${s+1}</span><span class="r">${esc(r)}</span><button class="chk ${chk[id]?"on":""}" data-id="${id}" data-rest="${ex.descanso}" data-nome="${esc(ex.nome)}" aria-label="série ${s+1}">✓</button></div>` }).join("")}</div>
        ${cargaBox(ex)}</article>`;
    });
    h += `<button class="btn" id="fim">Concluir treino</button><button class="btn ghost" id="zerar">Zerar marcações deste treino</button>` + histBlock();
    $("#main").innerHTML = h;
    updateProgress();
  }
  function histBlock(){
    const h = store.get("historico", []);
    if (!h.length) return `<div class="hist"><h4>Histórico</h4><div class="mus">Seus treinos concluídos aparecem aqui.</div></div>`;
    const semana = h.filter(x => Date.now() - x.ts < 7*864e5);
    const card = semana.filter(x => x.id === "C").length;
    return `<div class="hist"><h4>Histórico · ${semana.length} nos últimos 7 dias${card ? ` (${card} de cardio)` : ""}</h4>
      ${h.slice(0,8).map((x,k) => `<div class="row"><span>${esc(x.data)} · ${esc(x.dia)}</span><span>${esc(x.duracao)} · ${x.pct}%</span><button class="del" data-del="${k}" aria-label="Apagar este registro">✕</button></div>`).join("")}
      <div class="mus" style="margin-top:6px">Registrou sem querer? Toque no ✕ duas vezes para apagar.</div></div>`;
  }
  function updateProgress(){
    const d = P.dias.find(x => x.id === dia); if (!d) return { feitas: 0, tot: 1 };
    const feitas = Object.values(getChk()).filter(Boolean).length, tot = totalItens(d);
    const bar = $("#prog"); if (bar) bar.style.width = Math.min(100, feitas/tot*100) + "%";
    document.querySelectorAll(".ex").forEach(el => { const b = el.querySelectorAll(".chk"); el.classList.toggle("done", b.length > 0 && [...b].every(x => x.classList.contains("on"))) });
    return { feitas, tot };
  }

  // som, vibração, tela acesa
  let audio = null, wake = null;
  function unlockAudio(){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume() }catch(e){} }
  function tone(f, t0, len, vol){ try{ const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(vol, audio.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t0 + len); o.start(audio.currentTime + t0); o.stop(audio.currentTime + t0 + len) }catch(e){} }
  const bip = () => tone(660, 0, .12, .15);
  const troca = () => { tone(880, 0, .25, .22); try{ navigator.vibrate && navigator.vibrate(250) }catch(e){} };
  const fimSom = () => { [0,.25,.5].forEach(t => tone(988, t, .2, .22)); try{ navigator.vibrate && navigator.vibrate([200,100,200]) }catch(e){} };
  async function telaAcesa(on){ try{ if (on && "wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); if (!on && wake){ await wake.release(); wake = null } }catch(e){} }

  let seq = null, loop = null;
  function runSeq(fases, opts = {}){
    unlockAudio(); telaAcesa(true);
    seq = { fases, idx: 0, end: Date.now() + fases[0].seg * 1000, paused: null, lastBeep: null, opts };
    const multi = fases.length > 1;
    $("#tmP").hidden = !multi; $("#tmX").hidden = !multi; $("#tmA").hidden = multi;
    $("#tmS").textContent = multi ? "›|" : "Pular"; $("#tmP").textContent = "❚❚";
    $("#tm").classList.add("show"); clearInterval(loop); loop = setInterval(tick, 200); paint();
  }
  function paint(){
    if (!seq) return;
    const f = seq.fases[seq.idx], left = seq.paused != null ? seq.paused : (seq.end - Date.now()) / 1000;
    $("#tmT").textContent = fmt(left); $("#tmL").textContent = f.label; $("#tmN").textContent = f.sub || "";
    $("#tmG").style.width = Math.min(100, Math.max(0, (1 - left / f.seg) * 100)) + "%";
    const tm = $("#tm"); tm.classList.remove("cardio","end"); if (f.kind) tm.classList.add(f.kind);
  }
  function tick(){
    if (!seq || seq.paused != null) return;
    const now = Date.now();
    while (seq && now >= seq.end){
      const f = seq.fases[seq.idx]; f.onEnd && f.onEnd(); seq.idx++;
      if (seq.idx >= seq.fases.length){ acabou(); return }
      seq.end += seq.fases[seq.idx].seg * 1000; seq.lastBeep = null; if (now < seq.end) troca();
    }
    const left = Math.ceil((seq.end - now) / 1000);
    if (left <= 3 && left >= 1 && seq.lastBeep !== left && seq.fases[seq.idx].seg > 5){ seq.lastBeep = left; bip() }
    paint();
  }
  function acabou(){
    clearInterval(loop); loop = null; fimSom();
    const done = seq && seq.opts.onDone; seq = null;
    $("#tmT").textContent = "0:00"; $("#tmG").style.width = "100%";
    $("#tm").classList.remove("cardio"); $("#tm").classList.add("end"); $("#tmL").textContent = "Pronto!"; $("#tmN").textContent = "um gole de água";
    done && done(); telaAcesa(false);
    setTimeout(() => { if (!seq) $("#tm").classList.remove("show","end") }, 5000);
  }
  function stopSeq(){ clearInterval(loop); loop = null; seq = null; telaAcesa(false); $("#tm").classList.remove("show","cardio","end") }
  $("#tmA").onclick = () => { if (seq){ seq.end += 15000; seq.fases[seq.idx].seg += 15; paint() } };
  $("#tmS").onclick = () => {
    if (!seq || seq.fases.length === 1) return stopSeq();
    if (seq.paused != null){ seq.paused = null; $("#tmP").textContent = "❚❚" }
    seq.end = Date.now(); tick();
  };
  $("#tmP").onclick = () => {
    if (!seq) return;
    if (seq.paused == null){ seq.paused = (seq.end - Date.now())/1000; $("#tmP").textContent = "▶" }
    else { seq.end = Date.now() + seq.paused*1000; seq.paused = null; $("#tmP").textContent = "❚❚" }
    paint();
  };
  $("#tmX").onclick = () => duploToque($("#tmX"), "Parar?", stopSeq);
  function iniciarBloco(i){
    const ex = P.dias.find(x => x.id === dia).exercicios[i], rep = ex.repetir || 1, fases = [];
    for (let r = 0; r < rep; r++) ex.fases.forEach(f => fases.push({ label: f.label, sub: `${ex.nome}${rep > 1 ? ` · ${r+1}/${rep}` : ""}`, seg: f.seg, kind: "cardio" }));
    if (!store.get(startKey(), null)) store.set(startKey(), Date.now());
    runSeq(fases, { onDone: () => marcar(`${i}-0-0`) });
  }

  $("#main").addEventListener("click", e => {
    if (secao !== "treino") return;
    const go = e.target.closest(".go"); if (go){ iniciarBloco(+go.dataset.run); return }
    const c = e.target.closest(".chk");
    if (c){ const on = !getChk()[c.dataset.id]; marcar(c.dataset.id, on);
      if (on && c.dataset.rest) runSeq([{ label: "Descanso · " + c.dataset.nome, sub: "respire e beba um gole de água", seg: +c.dataset.rest }]); return }
    const st = e.target.closest(".stp");
    if (st){ const box = st.closest(".load"), inp = box.querySelector("input"), v = parseFloat(inp.value.replace(",", ".")) || 0;
      inp.value = Math.max(0, v + (+st.dataset.step) * (v >= 20 ? 2 : 1)); saveCarga(box); return }
    if (e.target.id === "fim"){
      const { feitas, tot } = updateProgress();
      if (!feitas){ const b = e.target, t = b.textContent; b.textContent = "Marque pelo menos um item"; setTimeout(() => b.textContent = t, 2500); return }
      const ini = store.get(startKey(), Date.now()), d = P.dias.find(x => x.id === dia), h = store.get("historico", []);
      const novo = { ts: Date.now(), id: d.id, data: new Date().toLocaleDateString("pt-BR"), dia: d.principal ? d.nome : `${d.id} · ${d.nome}`,
        duracao: Math.max(1, Math.round((Date.now()-ini)/60000)) + " min", pct: Math.round(feitas/tot*100) };
      if (h[0] && h[0].id === novo.id && Date.now() - h[0].ts < 3*36e5){
        h[0] = { ...h[0], pct: Math.min(100, Math.max(h[0].pct, novo.pct)), duracao: Math.max(parseInt(h[0].duracao)||0, parseInt(novo.duracao)||0) + " min" };
      } else h.unshift(novo);
      store.set("historico", h.slice(0, 80));
      store.del(chkKey()); store.del(startKey()); stopSeq(); toast("✓ Salvo no histórico e no Hoje"); render();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); return;
    }
    const del = e.target.closest("[data-del]");
    if (del){ duploToque(del, "Apagar?", () => { const h = store.get("historico", []); h.splice(+del.dataset.del, 1); store.set("historico", h); render() }); return }
    if (e.target.id === "zerar") duploToque(e.target, "Toque de novo para zerar", () => { store.del(chkKey()); store.del(startKey()); stopSeq(); render() });
  });
  $("#main").addEventListener("change", e => { if (secao !== "treino") return; const box = e.target.closest(".load"); if (box) saveCarga(box) });

  function tickClock(){
    const el = $("#clock");
    const ini = secao === "treino" ? store.get(startKey(), null) : null;
    if (!ini){ el.classList.remove("show"); return }
    el.classList.add("show"); el.textContent = "⏱ " + fmt((Date.now()-ini)/1000);
  }
  setInterval(tickClock, 1000);
  setInterval(() => { if (secao === "hoje" && dOff === 0 && !document.activeElement?.matches("input,textarea")) document.querySelectorAll("[data-sos]").forEach(el => { const m = S.sos.find(x => x.id === el.dataset.sos); const st = statusSOS(m); const b = el.querySelector(".st"); if (b){ b.className = "st " + st.cls; b.textContent = (st.cls==="no"?"⛔ ":st.cls==="wait"?"⏳ ":"✓ ") + st.txt } }) }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ if (seq){ tick(); telaAcesa(true) } else if (secao === "hoje") renderHoje() } });

  render();
})();
</script>
</body>
</html>
